################################################################
#    Example compose stack for WebFluid peering nodes.         #
################################################################

services:
  master:
    build: .
    command: ["master", "-h", "0.0.0.0"]
    volumes:
      - ./:/app
    networks:
      - traefik
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      labels:
        - traefik.enable=true

        - traefik.http.routers.myMaster.entrypoints=websecure
        - traefik.http.routers.myMaster.rule=Host(`peers.example.org`)
        - traefik.http.routers.myMaster.service=myMaster
        - traefik.http.routers.myMaster.tls=true

        - traefik.http.services.myMaster.loadbalancer.server.port=8000

  peer:
    build: .
    command: ["peer"]
    volumes:
      - ./:/app
    networks:
      - outbound
    deploy:
      replicas: 1


networks:
  traefik:  { external: true }
  outbound: {}
